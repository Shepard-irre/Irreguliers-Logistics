services:
  - type: web
    name: irreguliers-logistics-app
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://irreguliers-logistics-api-production.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
