services:
  - type: web
    name: irreguliers-logistics-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_ORIGIN
        value: https://irreguliers-logistics-app.onrender.com

  - type: web
    name: irreguliers-logistics-app
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://irreguliers-logistics-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
